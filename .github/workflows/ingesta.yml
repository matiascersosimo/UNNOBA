name: ingesta-aulas

on:
  schedule:
    - cron: "0 9,10,11 * * 1-6"   # 06:00, 07:00 y 08:00 Argentina
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingesta

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python ingesta.py
      - name: Guardar cambios
        run: |
          git config user.name "aulas-bot"
          git config user.email "aulas-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ingesta $(date -u +%F)"
          git push
