name: ingesta-inicial

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ingestar últimos 10 días
        run: |
          HOY=$(TZ=America/Argentina/Buenos_Aires date +%d-%m-%Y)
          HACE_9_DIAS=$(TZ=America/Argentina/Buenos_Aires date -d "9 days ago" +%d-%m-%Y)
          python ingesta.py "$HACE_9_DIAS" "$HOY"

      - name: Guardar cambios
        run: |
          git config user.name "aulas-bot"
          git config user.email "aulas-bot@users.noreply.github.com"
          git add -A aulas.db pdfs/
          git diff --cached --quiet || git commit -m "Ingesta inicial de los últimos 10 días"
          git push
